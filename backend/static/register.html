<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte | Aura Skin</title>
    <link rel="stylesheet" href="/ikrame/panel.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="/"><img src="/assets/aura-skin-logo.svg" alt="Aura Skin by Chayy"></a>
      <section class="auth-panel">
        <p class="eyebrow">Espace client</p>
        <h1>Créer un compte</h1>
        <form id="register-form" class="form-stack">
          <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <label>Mot de passe<input name="password" type="password" autocomplete="new-password" required minlength="12" aria-describedby="password-help"></label>
          <p id="password-help" class="field-help">12 caractères minimum.</p>
          <button class="button button-dark" type="submit">Créer le compte</button>
          <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Déjà inscrit ? <a href="/login">Retour à la connexion</a></p>
      </section>
    </main>
    <script src="/auth.js" defer></script>
  </body>
</html>
