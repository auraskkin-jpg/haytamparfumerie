<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marque | Aura Skin</title>
    <style>
      body { margin: 0; font-family: sans-serif; color: #1b1716; background: #fff; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 5%; border-bottom: 1px solid #ebe2df; }
      header img { height: 48px; }
      header a { color: #8e5f58; text-decoration: none; font-weight: 600; }
      main { padding: 32px 5%; }
      .brand-head { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
      .brand-head img { width: 96px; height: 96px; object-fit: contain; border-radius: 16px; background: #faf6f4; }
      h1 { margin: 0; font: 400 clamp(28px, 4vw, 44px)/1.1 Georgia, serif; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px; }
      .item { display: grid; gap: 8px; padding: 14px; border: 1px solid #ebe2df; border-radius: 14px; background: #fff; color: inherit; text-decoration: none; }
      .item .media { aspect-ratio: 1 / 1; border-radius: 10px; background: #f6f1ef; overflow: hidden; display: grid; place-items: center; }
      .item .media img { width: 100%; height: 100%; object-fit: cover; }
      .item strong { font-size: 15px; }
      .item .price { font-weight: 700; font-size: 14px; }
      .item em { font-style: normal; font-size: 12px; font-weight: 700; color: #c0392b; }
      .empty { color: #7d716e; }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Accueil Aura Skin"><img src="/assets/aura-skin-logo.svg" alt="Aura Skin by Chayy"></a>
      <a href="/pages/marques-liste-a-z.html">Toutes les marques</a>
    </header>
    <main>
      <div class="brand-head">
        <img id="brand-logo" alt="" hidden>
        <h1 id="brand-name">Marque</h1>
      </div>
      <div id="brand-products" class="grid"></div>
      <p id="brand-empty" class="empty" hidden>Aucun produit pour cette marque pour le moment.</p>
    </main>
    <script src="/brand.js" defer></script>
  </body>
</html>
